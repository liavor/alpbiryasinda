<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alp'imiz 1 Yaşında! - Hafıza Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0f2fe; /* Soft Sky Blue */
            --card-back: #bae6fd; /* Baby Blue */
            --card-front: #fef08a; /* Soft Yellow */
            --accent: #0ea5e9; /* Deep Sky Blue */
            --success: #86efac; /* Mint Green */
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            color: #334155;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }

        /* Bulut Şeklinde HUD Paneli */
        .hud-panel {
            background: white;
            border-radius: 40px;
            padding: 12px 30px;
            margin: 0.5rem 0;
            display: flex;
            gap: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 4px solid var(--card-back);
            position: relative;
        }

        .hud-panel::before { content: '☁️'; position: absolute; left: -25px; top: -5px; font-size: 1.8rem; }
        .hud-panel::after { content: '✈️'; position: absolute; right: -25px; bottom: -5px; font-size: 1.8rem; }

        /* Oyun Alanı - 8x8 için optimize edildi */
        .game-container {
            perspective: 1000px;
            width: 95vw;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 24px;
            border: 6px solid white;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            width: 100%;
        }

        /* Kart Tasarımı */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card.matched {
            transform: rotateY(180deg) scale(0.95);
            filter: brightness(1.05);
            pointer-events: none;
            opacity: 0.8;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
            border: 2px solid white;
        }

        .card-front {
            background: var(--card-back);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 9v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9"/><path d="m9 14 3 3 3-3"/></svg>');
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            padding: 2px;
            overflow: hidden;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* HUD Yazıları */
        .stat-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; }
        .stat-value { font-size: 1.2rem; color: #0f172a; font-weight: 600; }

        /* Başlat Butonu */
        #start-btn {
            background: var(--accent);
            color: white;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: 600;
            border: 4px solid white;
            box-shadow: 0 6px 12px rgba(14, 165, 233, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            margin: 15px 0;
        }

        #start-btn:hover {
            transform: scale(1.05);
            background: #0284c7;
        }

        /* Yükleme Ekranı */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #f0f9ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .baby-loader { font-size: 4rem; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }

        @media (max-width: 600px) {
            .game-grid { gap: 3px; }
            .hud-panel { gap: 1rem; padding: 8px 15px; }
            .stat-value { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="baby-loader">Alp'imiz 1 yaşındaaaaaa!</div>
        <h1 class="text-2xl font-bold mt-4 text-blue-500">Alp'in Oyunu Yükleniyor...</h1>
        <div class="w-48 h-2 bg-blue-100 rounded-full mt-4 overflow-hidden">
            <div id="progress-fill" class="h-full bg-blue-400 w-0 transition-all"></div>
        </div>
    </div>

    <h1 class="text-3xl font-bold text-blue-600 mt-4 mb-1">Alp'imiz 1 Yaşında! 🎂</h1>
    <p class="text-blue-400 text-sm mb-2 font-medium">Bakalım Alp'in fotoğraflarını bulabilecek misin?</p>

    <div class="hud-panel">
        <div class="flex flex-col items-center">
            <span class="stat-label">Süre</span>
            <span id="timer" class="stat-value text-sky-600">03:00</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="stat-label">Hamle</span>
            <span id="moves" class="stat-value">0</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="stat-label">Eşleşme</span>
            <span id="matches" class="stat-value text-emerald-500">0/32</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid" class="game-grid">
            <!-- Kartlar JavaScript ile buraya gelecek -->
        </div>
    </div>

    <button id="start-btn">OYUNU BAŞLAT 🎢</button>

    <!-- Müzik ve Ses Dosyaları -->
    <audio id="bg-music" loop src="assets/bg-music.mp3"></audio>
    <audio id="flip-sound" src="assets/flip.mp3"></audio>
    <audio id="match-sound" src="assets/match.mp3"></audio>
    <audio id="error-sound" src="assets/error.mp3"></audio>
    <audio id="win-sound" src="assets/win.mp3"></audio>

    <script>
        const gridElement = document.getElementById('game-grid');
        const timerElement = document.getElementById('timer');
        const movesElement = document.getElementById('moves');
        const matchesElement = document.getElementById('matches');
        const startBtn = document.getElementById('start-btn');
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');

        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let timer = 180; // 3 dakika
        let timerInterval = null;
        let isLock = false;

        function initCards() {
            const pairs = 32; // 8x8 = 64 kart için 32 çift
            let tempCards = [];
            for (let i = 1; i <= pairs; i++) {
                // Uzantılar .jpeg olarak güncellendi
                tempCards.push({ id: i, img: `assets/${i}.jpeg` });
                tempCards.push({ id: i, img: `assets/${i}.jpeg` });
            }
            return shuffle(tempCards);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            gridElement.innerHTML = '';
            cards = initCards();
            
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card');
                cardEl.dataset.id = card.id;

                cardEl.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">
                        <img src="${card.img}" alt="Alp" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=alp${card.id}'">
                    </div>
                `;

                cardEl.addEventListener('click', flipCard);
                gridElement.appendChild(cardEl);
            });
        }

        function flipCard() {
            if (isLock) return;
            const card = this;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);
            playSound('flip-sound');

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLock = true;
            moves++;
            movesElement.textContent = moves;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    matchesElement.textContent = `${matchedCount}/32`;
                    playSound('match-sound');
                    flippedCards = [];
                    isLock = false;
                    if (matchedCount === 32) endGame(true);
                }, 500);
            } else {
                setTimeout(() => {
                    playSound('error-sound');
                    setTimeout(() => {
                        card1.classList.remove('flipped');
                        card2.classList.remove('flipped');
                        flippedCards = [];
                        isLock = false;
                    }, 700);
                }, 400);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 180;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timer--;
                updateTimerDisplay();
                if (timer <= 0) endGame(false);
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timer / 60);
            const secs = timer % 60;
            timerElement.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function endGame(isWin) {
            clearInterval(timerInterval);
            isLock = true;
            if (isWin) {
                playSound('win-sound');
                alert(`Harika! Alp'in tüm fotoğraflarını buldun. Mutlu Yıllar Alp! 🎉`);
            } else {
                alert("Süre bitti! Alp'in fotoğraflarını görmek için tekrar dene! 🐘");
            }
        }

        function playSound(id) {
            const sound = document.getElementById(id);
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(() => {});
            }
        }

        window.onload = () => {
            let progress = 0;
            const interval = setInterval(() => {
                progress += 20;
                progressFill.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => loadingScreen.style.display = 'none', 200);
                }
            }, 150);
        };

        startBtn.addEventListener('click', () => {
            createBoard();
            startTimer();
            matchedCount = 0;
            moves = 0;
            movesElement.textContent = "0";
            matchesElement.textContent = "0/32";
            isLock = false;
            
            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0.15;
            bgMusic.play().catch(() => {});
            
            startBtn.textContent = "BAŞTAN BAŞLA ✨";
        });
    </script>
</body>
</html>

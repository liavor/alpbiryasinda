<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alp'imiz 1 Yaşında! - Hafıza Oyunu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0f2fe;
            --card-back: #bae6fd;
            --accent: #0ea5e9;
            --success: #86efac;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            color: #334155;
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
        }

        .hud-panel {
            background: white;
            border-radius: 40px;
            padding: 12px 30px;
            margin: 0.5rem 0;
            display: flex;
            gap: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 4px solid var(--card-back);
            position: relative;
        }

        .game-container {
            perspective: 1000px;
            width: 95vw;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 24px;
            border: 6px solid white;
        }

        .game-grid {
            display: grid;
            gap: 8px;
            width: 100%;
        }

        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.flipped, .card.matched { transform: rotateY(180deg); }

        .card.matched {
            pointer-events: none;
            box-shadow: 0 0 15px rgba(134, 239, 172, 0.6);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .card-front {
            background: var(--card-back);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 9v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9"/><path d="m9 14 3 3 3-3"/></svg>');
            background-position: center;
            background-repeat: no-repeat;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .diff-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: white;
            border: 2px solid var(--accent);
            cursor: pointer;
            transition: all 0.2s;
        }

        .diff-btn.active {
            background: var(--accent);
            color: white;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #f0f9ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="text-4xl animate-bounce">🎂</div>
        <h1 class="text-2xl font-bold mt-4 text-blue-500">Alp'in Oyunu Yükleniyor...</h1>
    </div>

    <h1 class="text-3xl font-bold text-blue-600 mt-4">Alp'imiz 1 Yaşında! 🎈</h1>
    
    <div class="difficulty-selector mt-4">
        <button class="diff-btn active" onclick="setDifficulty(5)">Kolay (5x5)</button>
        <button class="diff-btn" onclick="setDifficulty(6)">Orta (6x6)</button>
        <button class="diff-btn" onclick="setDifficulty(8)">Zor (8x8)</button>
    </div>

    <div class="hud-panel">
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-500">Süre</span>
            <span id="timer" class="text-lg font-bold text-sky-600">03:00</span>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-xs text-gray-500">Eşleşme</span>
            <span id="matches" class="text-lg font-bold text-emerald-500">0/0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid" class="game-grid"></div>
    </div>

    <button id="start-btn" class="mt-6 bg-sky-500 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-sky-600 transition-all">OYUNU BAŞLAT 🎢</button>

    <audio id="bg-music" loop src="assets/bg-music.mp3"></audio>
    <audio id="flip-sound" src="assets/flip.mp3"></audio>
    <audio id="match-sound" src="assets/match.mp3"></audio>
    <audio id="error-sound" src="assets/error.mp3"></audio>
    <audio id="win-sound" src="assets/win.mp3"></audio>

    <script>
        const gridElement = document.getElementById('game-grid');
        const timerElement = document.getElementById('timer');
        const matchesElement = document.getElementById('matches');
        const startBtn = document.getElementById('start-btn');
        
        let difficulty = 5;
        let flippedCards = [];
        let matchedCount = 0;
        let totalPairs = 0;
        let timer = 180;
        let timerInterval = null;
        let isLock = false;

        function setDifficulty(size) {
            difficulty = size;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(size));
            });
            // Oyun alanını görsel olarak hazırla
            gridElement.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
        }

        function initCards() {
            const totalCards = difficulty * difficulty;
            totalPairs = Math.floor(totalCards / 2);
            let tempCards = [];
            
            for (let i = 1; i <= totalPairs; i++) {
                tempCards.push({ id: i, img: `assets/${i}.jpeg` });
                tempCards.push({ id: i, img: `assets/${i}.jpeg` });
            }

            // 5x5 gibi tek sayılı durumlarda bir adet boş/joker kart ekle
            if (totalCards % 2 !== 0) {
                tempCards.push({ id: 'joker', img: 'assets/logo.jpeg' }); 
            }

            return shuffle(tempCards);
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${difficulty}, 1fr)`;
            const cardsData = initCards();
            matchesElement.textContent = `0/${totalPairs}`;
            
            cardsData.forEach(data => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = data.id;

                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">
                        <img src="${data.img}" onerror="this.src='https://api.dicebear.com/7.x/fun-emoji/svg?seed=${data.id}'">
                    </div>
                `;

                card.addEventListener('click', flipCard);
                gridElement.appendChild(card);
            });
        }

        function flipCard() {
            if (isLock || this.classList.contains('flipped') || this.dataset.id === 'joker') return;

            this.classList.add('flipped');
            flippedCards.push(this);
            playSound('flip-sound');

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLock = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.id === card2.dataset.id;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedCount++;
                matchesElement.textContent = `${matchedCount}/${totalPairs}`;
                playSound('match-sound');
                flippedCards = [];
                isLock = false;
                if (matchedCount === totalPairs) endGame(true);
            } else {
                setTimeout(() => {
                    playSound('error-sound');
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLock = false;
                }, 1000);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 180;
            timerInterval = setInterval(() => {
                timer--;
                const mins = Math.floor(timer / 60).toString().padStart(2, '0');
                const secs = (timer % 60).toString().padStart(2, '0');
                timerElement.textContent = `${mins}:${secs}`;
                if (timer <= 0) endGame(false);
            }, 1000);
        }

        function endGame(isWin) {
            clearInterval(timerInterval);
            isLock = true;
            setTimeout(() => {
                alert(isWin ? "Tebrikler! Alp'in tüm fotoğraflarını buldun! 🎉" : "Süre doldu! Tekrar denemek ister misin? 🎂");
            }, 500);
        }

        function playSound(id) {
            const s = document.getElementById(id);
            if(s) { s.currentTime = 0; s.play().catch(()=>{}); }
        }

        startBtn.addEventListener('click', () => {
            matchedCount = 0;
            isLock = false;
            createBoard();
            startTimer();
            document.getElementById('bg-music').play().catch(()=>{});
            startBtn.textContent = "YENİDEN BAŞLAT ✨";
        });

        window.onload = () => {
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1000);
            setDifficulty(5); // Varsayılan kolay başla
        };
    </script>
</body>
</html>
